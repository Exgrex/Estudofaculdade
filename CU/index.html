<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>site de cubano</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <form>
        <h2>Formulario cuba</h2>
        <div class="form-group">
            <label for="name">Nome</label>
            <input type="text" id="name" placeholder="Digite seu nome" required>
            

        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Digite seu email" required>
            

        </div>

        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="Digite sua senha" required>
            

        </div>

        <div class="form-group">
            <label for="date">Data de nascimento</label>
            <input type="date" id="date" required>
        </div>

        <div class="form-group">
            <label for="number">Idade</label>
            <input type="number" id="number" required min="8" max="128">
        </div>

        
        <div class="form-group">
            <label>Gênero</label>
            <div class="inline">
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Masculino</label>


                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Feminino</label>
            </div>

            <div class="form-group">
                <label>Línguas faladas</label>
                <div class="inline">
                    <input type="checkbox" id="portugues" name="language" value="portuguese">
                    <label for="portuguese">Português</label>
    
    
                    <input type="checkbox" id="ingles" name="language" value="english">
                    <label for="english">Inglês</label>
                </div>

                <div class="form-group">
                    <label for="country">País</label>
                    <select name="country" id="country">
                        <option value="Brasil">Brasil</option>
                        <option value="Estados Unidos">Estados Unidos</option>
                        <option value="Nigeria">Nigéria</option>
                        <option value="Alemanha">Alemanha</option>
                        <option value="Japão">Japão</option>



                    </select>
                
                </div>

                    <div class="form-group">
                        <label for="bio">biografia</label>
                        <textarea name="bio" id="bio" rows="10" placeholder="Escreva um pouco sobre você"></textarea>

                    </div>

                 
                <fieldset>
                    <legend>Informações Pessoais</legend>
                    <div class="form-group">
                        <label for="browser">Navegador</label>
                        <select list="Browsers" type="Browser" id="Browser">
                        <datalist>
                                <option value="Chrome">Google Chrome</option>
                                <option value="Firefox">Firefox</option>
                                <option value="Opera">Opera</option>
                                <option value="Brave">Brave</option>
                        </datalist>
                    </div>
                    
                    
                    <div class="form-group">
                    
                        <label for="website">Site Pessoal</label>
                        <input type="url" id="website" name="website" placeholder="https://www.dexerto.com/entertainment/amelia-watson-ends-vtuber-activities-but-isnt-graduating-from-hololive-2905461/">
                    </div>
                    
                    <div class="form-group">
                    <label for="file">Carregar Arquivos</label>
                    <input type="file" id="upload" name="file" accept=".jpg,.png,.gif,.jpeg" required>
                    
                    </div>
                    <div class="form-group">
                        <button type="submit" class="move">Enviar</button>
                    </div>
                    
                </fieldset>

        

    </form>


</body>
</html>
