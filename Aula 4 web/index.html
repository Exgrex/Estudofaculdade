<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Teste</title>
</head>
<body>
    <!--botao de genero-->
    <label>Genêro</label>
    <input type="radio" name="genero" value="masculino" id="masc" checked>
    <label for="masc">Masculino</label>
    <input type="radio" name="genero" value="feminino" id="fem">
    <label for="fem">Feminino</label>
<br><br>
    <!--botao de preferencias-->
    <input type="checkbox" name="preferencias" value="musica" id="musica" checked>
    <label for="musica">Música</label>
    <input type="checkbox" name="preferencias" value="esporte" id="esporte">
    <label for="esporte">Esporte</label>
<br><br>
    <!--botao de opcoes-->
    <select name="opcoes" id="opcoes">
        <option value="1">Opção 1</option>
        <option value="2">Opção 2</option>
    </select>
<br><br>
    <select name="multi_opcoes" multiple size="3">
        <option value="1">Opção 1</option>
        <option value="2">Opção 2</option>
        <option value="3">Opção 3</option>
    </select>
    <br><br>
    <!--botao de enviar o documento e etcs-->
    <input type="submit" value="Enviar">
    <input type="reset" value="Limpar">
    <button type="button" onclick="alert('Você clicou')">Clique Aqui</button>
<br><br>
    <!--Local para prencher as informações pessoais-->
    <fieldset>
        <legend>Informações Pessoais</legend>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" required>
        <label for="idade">Idade</label>
        <input type="number" id="idade" nome="idade">
    </fieldset>

    
    <br><br>
    <select name="categoria">
        <optgroup label="Frutas">
            <option value="Maçã">Maçã</option>
            <option value="banana">Banana</option>
        </optgroup>
        
        <optgroup label="Legumes">
            <option value="cenoura">Cenoura</option>
            <option value="batata">Batata</option>
        </optgroup>
    </select>
    <br><br>
    <label for="navegador">Escolha seu navegador</label>
    <input list="navegadores" id="navegador" name="navegador">
    <datalist id="navegadores">
        <option value="Chrome">
        <option value="Firefox">
        <option value="Edge">
        <option value="Safari">
    </datalist>
    <br><br>
    <label for="valor1">Valor 1</label>
    <input type="number" id="valor1" value="50">
    <label for="valor2">Valor 2</label>
    <input type="number" id="valor2" value="30">
    <button type="button" onclick="somar()">Somar</button>
    <output name="resultado" for="valor1 valor2"></output>
    
    <script>
        function somar(){
            var v1 = 
                parseInt(document.getElementById('valor1').value);
            
            var v2 = 
                parseInt(document.getElementById('valor2').value);
            document.querySelector('output[name="resultado"]').value = v1 + v2;


        }
    </script>

</body>
</html>
